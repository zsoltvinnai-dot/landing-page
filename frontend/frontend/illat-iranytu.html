<style>
:root{
  --ink:#0b0a08; --ink-soft:#17130f; --cream:#f7f0e6; --paper:#fffdfa; --beige:#d9c4aa;
  --pink:#d78bab; --pink-deep:#c75b8a; --gold:#d9ae4b; --gold-btn:#e0bb67; --gold-light:#f4d785;
  --muted:#b9ab99; --faint:rgba(247,240,230,.14); --card:rgba(247,240,230,.04);
  --display:"Bodoni Moda","Times New Roman",serif; --body:"Manrope",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:var(--body); color:var(--cream); background:var(--ink); -webkit-font-smoothing:antialiased; line-height:1.6;
  background-image:radial-gradient(70% 45% at 85% 0%, rgba(217,174,75,.10), transparent 70%), radial-gradient(60% 40% at 0% 45%, rgba(215,139,171,.07), transparent 70%);
  background-attachment:fixed}
body::before{content:""; position:fixed; inset:0; pointer-events:none; opacity:.05; z-index:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.85'/%3E%3C/svg%3E")}
a{color:inherit}
button{font:inherit; color:inherit; cursor:pointer; background:none; border:0}
.site-top{position:relative; z-index:2; display:flex; align-items:center; justify-content:space-between; gap:16px; padding:12px clamp(20px,5vw,70px); border-bottom:1px solid var(--faint)}
.site-top img{width:126px; height:62px; object-fit:contain; display:block}
.site-top .hcta{font-size:12px; letter-spacing:.14em; text-transform:uppercase; text-decoration:none; border-bottom:1px solid var(--gold); padding:6px 0}
.wrap{position:relative; z-index:1; max-width:620px; margin:0 auto; padding:22px 20px 70px}
.kicker{font-size:11px; letter-spacing:.19em; text-transform:uppercase; color:var(--gold-light); font-weight:600}
h1,h2,h3{font-family:var(--display); font-weight:400; line-height:1.1; letter-spacing:-.02em}
h1 em,h2 em{font-style:italic; color:var(--pink)}
.serif-i{font-family:var(--display); font-style:italic; color:var(--pink)}

.top{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px}
.brand{display:flex; align-items:center; gap:10px}
.brand b{font-family:var(--display); font-weight:500; font-size:18px; letter-spacing:.01em}
.compass{width:38px; height:38px; flex:none}
.compass .needle{transform-origin:50% 50%; transition:transform .7s cubic-bezier(.3,1.5,.5,1)}
.step{font-size:11px; color:var(--muted); font-weight:600; letter-spacing:.16em; text-transform:uppercase}
.bar{height:1px; background:var(--faint); overflow:hidden; margin:-4px 0 24px}
.bar i{display:block; height:100%; width:0; background:linear-gradient(90deg,var(--gold),var(--pink)); transition:width .5s ease}

.hero{padding:22px 0 6px; animation:rise .8s ease both}
.hero h1{font-size:clamp(44px,12vw,76px); margin:14px 0 18px}
.hero p.lead{font-size:16.5px; color:var(--muted); max-width:34em}
.hero p.lead b{color:var(--cream); font-weight:600}
.rose{position:relative; margin:30px auto 26px; width:min(310px,80vw); aspect-ratio:1}
.rose svg{width:100%; height:100%; overflow:visible}
.rose svg .petals{transform-origin:50% 50%; transform-box:view-box; animation:breathe 6s ease-in-out infinite}
.rose .core{position:absolute; inset:0; display:grid; place-items:center; text-align:center; pointer-events:none}
.rose .core > div{width:98px; height:98px; border-radius:50%; display:grid; place-content:center; background:radial-gradient(circle,#15120e 62%,rgba(21,18,14,.85)); box-shadow:0 0 0 1px rgba(217,174,75,.5), 0 0 34px rgba(11,10,8,.95)}
.rose .core span{font-family:var(--display); font-size:46px; color:var(--gold-light); line-height:1}
.rose .core small{display:block; font-size:9.5px; letter-spacing:.24em; text-transform:uppercase; color:var(--muted); margin-top:4px}
.facts{display:grid; gap:0; margin:6px 0 30px; border-top:1px solid var(--faint)}
.fact{display:flex; gap:14px; align-items:flex-start; padding:14px 2px; border-bottom:1px solid var(--faint); font-size:14.5px; color:var(--muted)}
.fact b{color:var(--cream); font-weight:600}
.fact .ic{flex:none; font-size:10px; letter-spacing:.16em; font-weight:700; color:var(--gold); padding-top:4px; width:22px}
.cta{display:flex; width:100%; align-items:center; justify-content:center; gap:10px; min-height:54px; padding:15px 22px; border-radius:3px; text-decoration:none;
  background:var(--gold-btn); color:#15100a; font-weight:700; font-size:14px; letter-spacing:.1em; text-transform:uppercase; border:1px solid var(--gold-btn); transition:background .2s,color .2s,transform .12s}
.cta:hover{background:var(--cream); border-color:var(--cream)}
.cta:active{transform:scale(.985)}
.cta.ghost{background:transparent; border-color:rgba(247,240,230,.5); color:var(--cream)}
.cta.ghost:hover{background:var(--cream); color:#15100a}
.fine{font-size:12px; color:var(--muted); margin-top:14px; text-align:center}

.q{animation:rise .45s ease both}
.q .num{font-family:var(--display); font-style:italic; color:var(--pink); font-size:16px}
.q h2{font-size:clamp(28px,7.6vw,40px); margin:6px 0 10px}
.q .sub{color:var(--muted); font-size:14px; margin-bottom:4px}
.q .gifthint{font-size:13px; color:var(--pink); margin-bottom:4px}
.opts{display:grid; gap:10px; margin:20px 0 18px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{display:flex; align-items:center; gap:13px; text-align:left; padding:13px 14px; border-radius:4px; border:1px solid var(--faint);
  background:var(--card); transition:border-color .2s, background .2s, transform .12s; position:relative; min-height:60px; animation:rise .45s ease both}
.opt:hover{border-color:rgba(217,174,75,.55)}
.opt:active{transform:scale(.985)}
.opt .em{flex:none; width:38px; height:38px; border-radius:50%; display:grid; place-items:center; font-size:19px; background:rgba(247,240,230,.06)}
.opt .sw{flex:none; width:38px; height:38px; border-radius:50% 50% 3px 3px; box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.opt .tx{font-size:15px; font-weight:500; line-height:1.3}
.opt .tx small{display:block; font-size:12px; color:var(--muted); font-weight:400; margin-top:2px}
.opt.sel{border-color:var(--gold); background:rgba(217,174,75,.10)}
.opt.sel::after{content:"✓"; position:absolute; right:12px; top:50%; transform:translateY(-50%); width:22px; height:22px; border-radius:50%; background:var(--gold); color:#15100a; font-size:12px; font-weight:800; display:grid; place-items:center}
.opts.two .opt{flex-direction:column; align-items:flex-start; padding:14px}
.opts.two .opt.sel::after{top:12px; transform:none}
.toggle{display:flex; align-items:center; gap:10px; font-size:14px; color:var(--muted); margin:-4px 0 16px; padding:4px 2px}
.toggle input{accent-color:var(--gold); width:18px; height:18px}
.nav{display:flex; gap:10px; align-items:center}
.nav .back{padding:15px 18px; min-height:54px; border-radius:3px; border:1px solid var(--faint); color:var(--muted); font-weight:600; font-size:13px; letter-spacing:.06em}
.nav .cta{flex:1}
.nav .cta[disabled]{opacity:.35}

.res{animation:rise .6s ease both}
.res h1{font-size:clamp(36px,10vw,58px); margin:10px 0 8px}
.profile{display:grid; grid-template-columns:150px 1fr; gap:16px; align-items:center; margin:18px 0 8px; padding:16px; border:1px solid rgba(217,174,75,.35); border-radius:4px; background:rgba(247,240,230,.03)}
.profile svg{width:150px; height:150px}
.profile h3{font-size:22px; margin-bottom:6px}
.profile p{font-size:13.5px; color:var(--muted)}
.chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px}
.chip{display:inline-flex; align-items:center; gap:6px; font-size:12px; padding:5px 10px; border-radius:999px; border:1px solid var(--faint)}
.chip i{width:9px; height:9px; border-radius:50%; display:inline-block}
.filters{display:flex; gap:6px; margin:18px 0 4px; flex-wrap:wrap}
.filters button{font-size:11.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; padding:9px 14px; border-radius:3px; border:1px solid var(--faint); color:var(--muted)}
.filters button.on{background:var(--gold-btn); color:#15100a; border-color:var(--gold-btn)}
.label{font-size:11px; letter-spacing:.19em; text-transform:uppercase; color:var(--gold-light); font-weight:600; margin:30px 0 12px}

/* termékkártya: világos „papír” szekció, mint Anita oldalán */
.pcard{border-radius:4px; overflow:hidden; background:var(--cream); color:var(--ink-soft); margin-bottom:16px; position:relative}
.pcard.hero-card{box-shadow:0 24px 60px rgba(0,0,0,.45)}
.phead{display:grid; grid-template-columns:118px 1fr; gap:16px; padding:20px 18px 6px; align-items:end}
.ph{position:relative; width:118px; height:156px; border-radius:45% 45% 3px 3px; background:linear-gradient(180deg,#efe3d3,#e2d2bd); display:grid; place-items:center; overflow:hidden}
.ph svg{width:94px; height:128px; margin-top:14px}
.ph img{position:absolute; inset:0; width:100%; height:100%; object-fit:contain; background:#fff; opacity:0; transition:opacity .4s}
.ph img.ok{opacity:1}
.code{font-family:var(--display); font-size:42px; line-height:1; color:var(--ink); letter-spacing:-.02em}
.pname{font-family:var(--display); font-style:italic; font-size:21px; margin-top:4px; color:var(--pink-deep)}
.tags{display:flex; flex-wrap:wrap; gap:5px; margin-top:10px}
.tag{font-size:10px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; padding:4px 8px; border:1px solid rgba(23,19,15,.18); border-radius:2px; color:#51483e}
.tag.lux{border-color:#bc9b61; color:#725626; background:rgba(217,174,75,.14)}
.match{position:absolute; top:16px; right:16px; text-align:right}
.match b{display:block; font-family:var(--body); font-size:20px; color:var(--pink-deep); font-weight:800; letter-spacing:-.01em}
.match small{font-size:9.5px; letter-spacing:.16em; text-transform:uppercase; color:#887f74}
.pbody{padding:8px 18px 20px}
.why{font-size:14.5px; line-height:1.6; padding:12px 14px; border-left:2px solid #ad8140; background:#f1e8dd; margin:10px 0 16px}
.desc{font-size:14px; color:#51483e; margin-bottom:16px}
.pyr{display:grid; gap:8px; margin-bottom:16px; border-top:1px solid #ded4c7; padding-top:14px}
.pyr > div{display:grid; grid-template-columns:62px 1fr; gap:10px; font-size:14px}
.pyr span{font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:#725626; font-weight:700; padding-top:3px}
.fmts{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:6px}
.fmts span{font-size:12px; padding:5px 9px; border:1px solid #d9c4aa; border-radius:2px; color:#51483e}
.fmtnote{font-size:11px; color:#887f74; margin-bottom:16px}
.pcard .label{color:#725626}
.wear{list-style:none; display:grid; gap:9px}
.wear li{font-size:14px; padding-left:22px; position:relative; color:var(--ink-soft)}
.wear li::before{content:"✦"; position:absolute; left:0; color:#ad8140; font-size:12px; top:2px}
.more{width:100%; padding:13px; font-size:12px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:#725626; border-top:1px solid #ded4c7}
.mini .pbody{display:none}
.mini.open .pbody{display:block}
.mini .code{font-size:34px}
.mini .ph{width:92px; height:122px}
.mini .ph svg{width:72px; height:100px}
.mini .phead{grid-template-columns:92px 1fr; padding-bottom:14px}
.pro{border:1px solid var(--faint); border-radius:4px; padding:16px; background:var(--card)}
.pro p{font-size:13.5px; color:var(--muted); margin-bottom:12px}
.pro .codes{display:flex; flex-wrap:wrap; gap:6px}
.pro .codes span{font-family:var(--display); font-size:16px; padding:6px 11px; border:1px solid rgba(217,174,75,.4); border-radius:2px; color:var(--gold-light)}
.pro .codes span small{font-family:var(--body); font-size:11px; color:var(--muted); margin-left:5px}
.pro .codes span{font-variant-numeric:lining-nums}
.actions{display:grid; gap:10px; margin-top:24px}
.copied{font-size:13px; color:var(--gold-light); text-align:center; min-height:18px}
textarea.cp{width:100%; height:140px; margin-top:8px; background:rgba(0,0,0,.35); color:var(--cream); border:1px solid var(--faint); border-radius:3px; padding:10px; font:13px var(--body)}
.note{font-size:12px; color:var(--muted); margin-top:24px; text-align:center; line-height:1.6}
.empty{padding:20px; text-align:center; color:var(--muted); border:1px dashed var(--faint); border-radius:4px}
.site-foot{position:relative; z-index:1; padding:34px clamp(20px,5vw,70px); border-top:1px solid var(--faint); font-size:12px; color:#bbad9c}
.site-foot nav{display:flex; flex-wrap:wrap; gap:12px 22px; margin-bottom:16px}
.site-foot a{color:#e8ddd0; text-underline-offset:4px}

.still, .still .opt{animation:none!important}
@keyframes rise{from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:none}}
@keyframes breathe{0%,100%{transform:scale(.94)} 50%{transform:scale(1.04)}}
@media (min-width:900px){.wrap{max-width:680px; padding-top:40px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
:focus-visible{outline:3px solid var(--pink-deep); outline-offset:3px}

</style>

function compassSVG(rot){
  return `<svg class="compass" viewBox="0 0 40 40"><circle cx="20" cy="20" r="18.5" fill="none" stroke="#d9ae4b" stroke-opacity=".6"/>
  <circle cx="20" cy="20" r="14" fill="none" stroke="#d9ae4b" stroke-opacity=".2"/>
  ${[0,90,180,270].map(a=>`<line x1="20" y1="2.5" x2="20" y2="6" stroke="#d9ae4b" transform="rotate(${a} 20 20)"/>`).join('')}
  <g class="needle" style="transform:rotate(${rot}deg)"><path d="M20 6 L23 20 L20 22 L17 20Z" fill="#d78bab"/><path d="M20 34 L23 20 L20 18 L17 20Z" fill="#f7f0e6" fill-opacity=".7"/></g>
  <circle cx="20" cy="20" r="1.6" fill="#0b0a08" stroke="#d9ae4b"/></svg>`;
}
function roseSVG(vals, size, labels){
  const c = size/2, R = size/2 - (labels ? 34 : 6), n = DIMS.length, st = 2*Math.PI/n;
  let s = `<svg viewBox="0 0 ${size} ${size}">`, lab = '';
  for (let r of [0.33,0.66,1]) s += `<circle cx="${c}" cy="${c}" r="${R*r}" fill="none" stroke="#d9ae4b" stroke-opacity="${r===1?.45:.16}"/>`;
  s += '<g class="petals">';
  DIMS.forEach((k,i) => {
    const a0 = -Math.PI/2 + i*st + st*0.08, a1 = -Math.PI/2 + (i+1)*st - st*0.08, rr = R*Math.max(.06, vals[i]);
    const p = (a,r)=>`${(c+r*Math.cos(a)).toFixed(1)} ${(c+r*Math.sin(a)).toFixed(1)}`;
    s += `<path d="M${c} ${c} L${p(a0,rr)} A${rr} ${rr} 0 0 1 ${p(a1,rr)} Z" fill="${FAM[k].c}" fill-opacity="${vals[i]>0.05?.85:.18}"/>`;
    if (labels){ const am=(a0+a1)/2; lab += `<text x="${c+(R+14)*Math.cos(am)}" y="${c+(R+14)*Math.sin(am)+3}" text-anchor="middle" font-size="8.5" fill="#f7f0e6" fill-opacity=".7" font-family="Manrope">${FAM[k].n.split('-')[0]}</text>`; }
  });
  return s + `</g>${lab}<circle cx="${c}" cy="${c}" r="3" fill="#d9ae4b"/></svg>`;
}

function profile(){
  const U = Array(10).fill(0); let its = [], di = 0, skin = 'norm', occ = 'any', sz = 'all';
  Q.forEach((q,qi) => {
    const sel = q.type === 'multi' ? A[qi] : (A[qi] == null ? [] : [A[qi]]);
    sel.forEach(oi => { const o = q.o[oi]; if (o.w) W(o.w).forEach((x,i)=> U[i] += x*(q.k||1));
      if (o.it) its.push(o.it); if (o.di) di += o.di; if (o.skin) skin = o.skin; if (o.occ) occ = o.occ; if (o.sz) sz = o.sz; });
  });
  let tint = its.length ? its.reduce((a,b)=>a+b,0)/its.length : 2; tint = Math.max(1, Math.min(3, tint + di));
  const g = A[0] != null ? Q[0].o[A[0]].g : 'W';
  return {U, tint, skin, occ, sz, g, gift:isGift()};
}
function rank(P){
  const pos = P.U.map(x=>Math.max(0,x)), neg = P.U.map(x=>Math.max(0,-x));
  const np = Math.hypot(...pos) || 1, nm = Math.max(...neg) || 1;
  const ok = new Set([P.g]); if (unisex) ok.add('U');
  return D.filter(p => ok.has(p.g) && (lineFilter==='all' || p.l===lineFilter)).map(p => {
    const nv = Math.hypot(...p.v) || 1;
    const cos = pos.reduce((s,x,i)=>s+x*p.v[i],0)/(np*nv);
    const pen = neg.reduce((s,x,i)=>s+x*p.v[i],0)/nm * .7;
    const sc = cos - pen - .06*Math.abs(P.tint - p.i);
    return {p, sc, pct: Math.max(1, Math.min(99, Math.round(sc*100)))};
  }).sort((a,b)=>b.sc-a.sc);
}
const joinHu = a => a.length < 2 ? (a[0]||'') : a.slice(0,-1).join(', ') + ' és ' + a[a.length-1];
function whyText(P, p){
  const pos = P.U.map(x=>Math.max(0,x));
  const ctr = p.v.map((x,i)=>[x*pos[i], i]).sort((a,b)=>b[0]-a[0]).filter(x=>x[0]>0).slice(0,2);
  const you = P.gift ? 'Az ő' : 'A te';
  if (!ctr.length) return `${you} válaszaid alapján ez áll a legközelebb.`;
  const art = w => (/^[aáeéiíoóöőuúüű]/i.test(w) ? 'az ' : 'a ') + w;
  const notes = i => { const nn = (p.nd[i]||[]).slice(0,3).map(art); return nn.length ? joinHu(nn) : 'az illat szíve'; };
  const fam = i => art(FAM[DIMS[i]].n.toLowerCase());
  const [i0, i1] = ctr.map(x=>x[1]);
  const karakter = ['', 'könnyed, bőrközeli', 'kiegyensúlyozott', 'mély, testes'][p.i];
  const body = `${fam(i0)} oldalt ${notes(i0)} hozza` + (i1 != null ? `, ${fam(i1)} oldalt pedig ${notes(i1)}` : '');
  return `${P.gift ? 'Az ő illatprofilja' : 'Az illatprofilod'} leginkább ${ctr.map(([_,i])=>FAM[DIMS[i]].n.toLowerCase()).join(' és ')} irányba húz. Ebben az illatban ${body}. Karaktere ${karakter}.`;
}
function wearTips(P, p){
  const t = ['Próbáld ki a bőrödön, és adj neki 15–20 percet: a fejjegyek gyorsan elszállnak, ekkor nyílik ki az illat szíve.',
             'Fújd a pulzuspontokra (csukló, nyak, könyökhajlat), és ne dörzsöld össze a csuklódat: az összedörzsölés megtöri az illat szerkezetét.'];
  if (P.skin==='dry') t.push('Előtte vigyél fel illatmentes testápolót: a hidratált bőr tovább tartja az illatot.');
  if (P.skin==='oily' || P.tint<1.6) t.push('Elég 1–2 fújás: így marad bőrközeli és elegáns.');
  if (P.occ==='este') t.push('Estére frissíts rá egy fújással: a szív- és alapjegyek ilyenkor a legszebbek.');
  if (P.occ==='nap' && p.i===3) t.push('Munkába elég egy fújás: ez egy testes illat, kevéssel is messzire ér.');
  if (P.sz==='nyar') t.push('Melegben kevesebb is elég: a meleg bőr erősebben párologtatja az illatot.');
  if (P.gift) t.push('Ajándéknak a flakon gravírozással személyre szabható (név, dátum, rövid üzenet).');
  return t;
}
function famSummary(P){
  const pos = P.U.map(x=>Math.max(0,x)), mx = Math.max(...pos) || 1;
  const top = pos.map((x,i)=>[x,i]).sort((a,b)=>b[0]-a[0]).filter(x=>x[0]>0).slice(0,3);
  return {vals: pos.map(x=>x/mx), top};
}

   ${step===0 ? `<label class="toggle"><input type="checkbox" id="uni" ${unisex?'checked':''}> Uniszex illat is jöhet</label>` : ''}
   <div class="nav"><button class="back" id="back">← Vissza</button>
    <button class="cta" id="next" ${ready?'':'disabled'}>${step===Q.length-1?'Mutasd az illatom':'Tovább'} <span aria-hidden="true">→</span></button></div>
  </section>`;
  app.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    const i = +b.dataset.i, o = q.o[i];
    if (q.type === 'multi'){
      let s = A[step];
      if (o.none) s = s.includes(i) ? [] : [i];
      else { s = s.filter(x => !q.o[x].none); s = s.includes(i) ? s.filter(x=>x!==i) : [...s, i]; if (q.max && s.length > q.max) s = s.slice(-q.max); }
      A[step] = s; renderQ();
    } else { A[step] = i; renderQ(); if (step > 0) setTimeout(()=>{ if (A[step]===i && step < Q.length){ step++; render(); } }, 260); }
  });
  const uni = document.getElementById('uni'); if (uni) uni.onchange = e => unisex = e.target.checked;
  document.getElementById('back').onclick = () => { step--; render(); };
  document.getElementById('next').onclick = () => { if (ready){ step++; render(); } };
}
function cardHTML(r, P, kind, idx){
  const p = r.p, uid = kind + idx;
  const nm = p.n || 'Olfazeta ' + p.c;
  const gtag = {W:'Női', M:'Férfi', U:'Uniszex'}[p.g];
  const fm = (p.f||[]).filter(x=>/ml/i.test(x));
  const fmts = fm.length ? fm : [`${p.s||''} ${p.pr||''}`.trim()];
  return `<article class="pcard ${kind==='hero'?'hero-card':'mini'}" id="c-${uid}">
   <div class="match"><b>${r.pct}%</b><small>egyezés</small></div>
   <div class="phead"><div class="ph">${bottleSVG(p, uid)}${p.img?`<img src="${esc(p.img)}" alt="${esc(nm)}" decoding="async">`:''}</div>
    <div><div class="code">${esc(p.c)}</div><div class="pname">${esc(nm)}</div>
     <div class="tags"><span class="tag">${gtag}</span><span class="tag ${p.l==='Luxury'?'lux':''}">${p.l}</span><span class="tag">${['','könnyed','közepes','testes'][p.i]}</span></div></div></div>
   <div class="pbody">
    <p class="why">${esc(whyText(P, p))}</p>
    ${p.d ? `<p class="desc">${esc(p.d)}</p>` : ''}
    <div class="pyr">${[['Fej',p.t],['Szív',p.h],['Alap',p.b]].filter(x=>x[1].length).map(([l,a])=>`<div><span>${l}</span><div>${esc(a.join(', '))}</div></div>`).join('')}</div>
    <div class="fmts">${fmts.map(x=>`<span>${esc(x)}</span>`).join('')}</div><p class="fmtnote">Chogan katalógusár (2026. november)</p>
    ${kind==='hero' ? `<div class="label" style="margin-top:4px">Hogyan viseld</div><ul class="wear">${wearTips(P,p).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>` : ''}
   </div>
   ${kind!=='hero' ? `<button class="more" data-t="c-${uid}">Részletek ▾</button>` : ''}
  </article>`;
}
function resultText(P, R){
  const fs = famSummary(P).top.map(([_,i])=>FAM[DIMS[i]].n).join(', ');
  const L = R.slice(0,3).map((r,i)=>`${i+1}. ${r.p.c}${r.p.n?' – '+r.p.n:''} (${r.pct}%)`).join('\n');
  return `Szia Anita! Kitöltöttem az Illat-iránytűt${P.gift?' (ajándékba keresek)':''}.\nIllatprofil: ${fs}\n${L}\nSzeretném kipróbálni őket!`;
}
function renderResult(){
  const P = profile(), R = rank(P), fs = famSummary(P);
  const top = R[0];
  const profTitle = fs.top.length ? fs.top.slice(0,2).map(([_,i])=>FAM[DIMS[i]].n).join(' + ') : 'Nyitott orr';
  const profDesc = fs.top.length ? fs.top.slice(0,2).map(([_,i])=>FAM[DIMS[i]].d).join('; ') : 'Szinte minden irány szóba jöhet.';
  app.innerHTML = header() + `<section class="res">
   <div class="kicker">${P.gift ? 'Az ő illata' : 'A te illatod'}</div>
   <h1>${top ? esc(top.p.c) + (top.p.n ? ' · <span class="serif-i">' + esc(top.p.n) + '</span>' : '') : 'Nincs találat'}</h1>
   <div class="profile">${roseSVG(fs.vals, 150, false)}<div><h3>${esc(profTitle)}</h3><p>${esc(profDesc)}.</p>
    <div class="chips">${fs.top.map(([_,i])=>`<span class="chip"><i style="background:${FAM[DIMS[i]].c}"></i>${FAM[DIMS[i]].n}</span>`).join('')}</div></div></div>
   <div class="filters">${[['all','Mind'],['Olfazeta','Olfazeta'],['Luxury','Luxury']].map(([k,l])=>`<button data-f="${k}" class="${lineFilter===k?'on':''}">${l}</button>`).join('')}</div>
   ${top ? `<div class="label">Az első számú ajánlás</div>${cardHTML(top, P, 'hero', 0)}
   <div class="label">Ha még többet próbálnál</div>${R.slice(1,3).map((r,i)=>cardHTML(r,P,'alt',i)).join('')}
   <div class="label">Kipróbálási sorrend</div>
   <div class="pro"><p>Ezeket érdemes Anitánál sorban kipróbálni. Egyszerre legfeljebb 3–4 illatot, mert utána elfárad az orr.</p>
    <div class="codes">${R.slice(0,8).map(r=>`<span>${esc(r.p.c)}<small>${r.pct}%</small></span>`).join('')}</div></div>`
   : `<div class="empty">Ezzel a szűréssel nincs találat. Válaszd a „Mind” lehetőséget.</div>`}
   <div class="actions">
    <a class="cta" id="copy" href="https://m.me/AnitaLashandMakeUpMovar" target="_blank" rel="noopener">Elküldöm Anitának Messengerben</a>
    <div class="copied" id="copied"></div>
    <a class="cta ghost" href="tel:+36309223271">Illatpróbát kérek · +36 30 922 3271</a>
    <button class="cta ghost" id="again">Újrakezdés</button>
   </div>
   <p class="note">Az ajánlás a Chogan katalógusában szereplő illatpiramisok alapján számolt javaslat. A végső szót a bőröd mondja ki, ezért próbáld ki Anitánál, mielőtt döntesz.</p>
  </section>`;
  hookImages();
  app.querySelectorAll('.filters button').forEach(b => b.onclick = () => { lineFilter = b.dataset.f; renderResult(); });
  app.querySelectorAll('.more').forEach(b => b.onclick = () => { const c = document.getElementById(b.dataset.t); c.classList.toggle('open'); b.textContent = c.classList.contains('open') ? 'Bezárás ▴' : 'Részletek ▾'; });
  document.getElementById('again').onclick = () => { A = Q.map(q => q.type==='multi' ? [] : null); step = -1; lineFilter='all'; unisex=true; render(); };
  document.getElementById('copy').onclick = () => {
    const txt = resultText(P, R), out = document.getElementById('copied');
    const fallback = () => { out.innerHTML = 'Másold ki, és illeszd be az üzenetbe:<textarea class="cp" readonly>' + esc(txt) + '</textarea>'; };
    try { navigator.clipboard.writeText(txt).then(() => { out.textContent = 'Az eredményed a vágólapon van: illeszd be az üzenetbe.'; }, fallback); }
    catch(e){ fallback(); }
  };
}
function render(){
  if (step < 0) renderIntro(); else if (step >= Q.length) renderResult(); else renderQ();
  window.scrollTo({top:0, behavior:'smooth'});
}
render();
</script>
